name: Inspect lesson sources
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-curriculum.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print source classifications
        run: node scripts/audit-curriculum-navigation.mjs
