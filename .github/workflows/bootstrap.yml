name: Build initial Curiveo Jr. from Curiveo
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: totoro0419/curiveo
          ref: main
          path: _upstream
          persist-credentials: false
      - name: Generate independent Jr. app
        run: |
          python3 -m pip install --user pillow
          python3 scripts/bootstrap-curiveojr.py
      - name: Commit and push application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub Actions tokens cannot create or modify other workflow files.
          rm -f .github/workflows/pages.yml .github/workflows/verify-pr.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap Curiveo Jr. pink app and starter lessons"
            git push
          fi
