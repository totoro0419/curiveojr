name: Remove promotional and non-lesson videos
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nonlesson-pruning.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remove strictly identified promotions, archive audit evidence
        run: |
          node --check scripts/prune-nonlessons.mjs
          npm run content:prune
      - name: Verify all remaining lessons and check build
        run: |
          npm run test:content
          npm run build
      - name: Commit curated catalog and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog.json src/data/catalog-runtime.json docs/content/NON_LESSON_REMOVAL.json docs/content/NON_LESSON_REMOVAL.md
          if ! git diff --cached --quiet; then
            git commit -m "Remove verified non-lesson promotions from catalog and all playlists"
            git push
          fi
